<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="100%" stop-color="#CFE8FF" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23ACFF" />
      <stop offset="100%" stop-color="#1991B3" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1991B3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="16" />

  <!-- Outer Card Mockup -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="640" height="460" rx="14" fill="#FFFFFF" />
    <!-- Browser Window Bar -->
    <rect x="80" y="70" width="640" height="48" rx="14" fill="#F1F5F9" />
    <circle cx="110" cy="94" r="7" fill="#EF4444" />
    <circle cx="132" cy="94" r="7" fill="#F59E0B" />
    <circle cx="154" cy="94" r="7" fill="#10B981" />
    <!-- Address Bar Simulation -->
    <rect x="200" y="82" width="400" height="24" rx="6" fill="#FFFFFF" />
    <rect x="220" y="89" width="140" height="10" rx="4" fill="#CBD5E1" />
  </g>

  <!-- Content Area Mockup -->
  <!-- Header Bar -->
  <rect x="120" y="150" width="560" height="54" rx="10" fill="url(#headerGrad)" />
  <circle cx="155" cy="177" r="14" fill="#FFFFFF" opacity="0.9" />
  <rect x="185" y="169" width="180" height="16" rx="4" fill="#FFFFFF" opacity="0.9" />

  <!-- Simulated Content Grid -->
  <g opacity="0.85">
    <!-- Left Hero/Banner Box -->
    <rect x="120" y="224" width="340" height="170" rx="10" fill="#E2E8F0" />
    <circle cx="290" cy="290" r="32" fill="#23ACFF" opacity="0.3" />
    <polygon points="280,274 308,290 280,306" fill="#1991B3" opacity="0.8" />
    <rect x="150" y="340" width="280" height="14" rx="4" fill="#94A3B8" opacity="0.7" />
    <rect x="180" y="362" width="220" height="10" rx="4" fill="#CBD5E1" />

    <!-- Right Sidebar Box -->
    <rect x="480" y="224" width="200" height="78" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <rect x="500" y="244" width="120" height="12" rx="4" fill="#64748B" opacity="0.6" />
    <rect x="500" y="266" width="160" height="10" rx="4" fill="#CBD5E1" />

    <rect x="480" y="316" width="200" height="78" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <rect x="500" y="336" width="100" height="12" rx="4" fill="#23ACFF" opacity="0.6" />
    <rect x="500" y="358" width="150" height="10" rx="4" fill="#CBD5E1" />
  </g>

  <!-- Bottom Accent / Status -->
  <rect x="120" y="416" width="560" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
  <!-- Icon & Text -->
  <g transform="translate(144, 436)">
    <circle cx="20" cy="20" r="20" fill="#23ACFF" opacity="0.15" />
    <path d="M12 20 L18 26 L28 14" stroke="#1991B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="56" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1E293B">
      Project Showcase Preview
    </text>
    <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">
      Portfolio Showcase • Gunawan Setia
    </text>
  </g>
</svg>
